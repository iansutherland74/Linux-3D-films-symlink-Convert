services:
  symlink-editor:
    build: .
    container_name: symlink-editor
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      FILMS_ROOT: ${FILMS_ROOT:-/mnt/3DFF}
      SYMLINK_EDITOR_HOST: ${SYMLINK_EDITOR_HOST:-192.168.1.14}
      SYMLINK_EDITOR_PORT: ${SYMLINK_EDITOR_PORT:-8080}
    volumes:
      - ${FILMS_DIR:-./films}:${FILMS_ROOT:-/mnt/3DFF}
    restart: unless-stopped
