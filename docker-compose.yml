services:
  casaco-file-browser:
    build: .
    container_name: casaco-file-browser
    ports:
      - "8080:8080"
    environment:
      FILE_BROWSER_HOST: 0.0.0.0
      FILE_BROWSER_PORT: 8080
      FILE_BROWSER_ROOT: /DATA
    volumes:
      - ${BROWSE_DIR:-./data}:/DATA
    restart: unless-stopped
